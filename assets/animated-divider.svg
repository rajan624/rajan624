<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16" role="img" aria-label="Animated rainbow divider"><defs><linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e676"><animate attributeName="stop-color" values="#00e676;#3b82f6;#ec4899;#f59e0b;#00e676" dur="8s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#ec4899;#f59e0b;#00e676;#8b5cf6" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#00e676;#3b82f6;#ec4899;#00e5ff" dur="8s" repeatCount="indefinite"/></stop></linearGradient></defs><rect x="0" y="5" width="1200" height="6" rx="3" fill="url(#rainbow)"/><rect x="0" y="5" width="1200" height="6" rx="3" fill="none" stroke="#ffffff" stroke-opacity=".3"><animate attributeName="stroke-opacity" values=".1;.7;.1" dur="2.5s" repeatCount="indefinite"/></rect></svg>